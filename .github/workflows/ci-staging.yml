name: CI/CD - Staging

on:
  push:
    branches: [ "main" ]
  pull_request:

env:
  AWS_REGION: eu-central-1
  IMAGE_NAME: digitalstudytools/web
  ECS_CLUSTER: digitalstudytools-cluster
  ECS_SERVICE_STAGING: digitalstudytools-web-staging

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Lint (flake8)
        run: flake8 app tests
      - name: Run tests
        run: pytest -q

  docker-build-and-push:
    # Deploy only on push to main and only while the AWS stack exists (repo variable DEPLOY_ENABLED=true)
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: build-and-test
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - id: ecr
        name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2
      - name: Build and push image (:SHA and :latest)
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          ECR="$REGISTRY/${{ env.IMAGE_NAME }}"
          SHA="${{ github.sha }}"
          docker build -t "$ECR:$SHA" -t "$ECR:latest" .
          docker push "$ECR:$SHA"
          docker push "$ECR:latest"

  deploy-staging:
    # Deploy only on push to main and only while the AWS stack exists (repo variable DEPLOY_ENABLED=true)
    if: github.event_name == 'push' && vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    needs: docker-build-and-push
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Deploy to ECS (staging)
        run: |
          aws ecs update-service \
            --cluster  "${{ env.ECS_CLUSTER }}" \
            --service  "${{ env.ECS_SERVICE_STAGING }}" \
            --force-new-deployment \
            --no-cli-pager